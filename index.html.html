<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>情緒翻翻樂｜ 情緒卡配對遊戲</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Zen Maru Gothic & Noto Sans TC for warm, readable Traditional Chinese -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    /* iPad 觸控與防誤觸最佳化 */
    * {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden; /* 確保在 iPad 上絕不出現捲軸 */
      touch-action: manipulation; /* 禁用雙擊縮放，提升點擊反應速度 */
      font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
      background-color: #FDF8F2; /* 溫暖米白底色 */
      color: #4A3F35;
    }

    /* 3D 翻牌動畫核心 */
    .perspective-container {
      perspective: 1200px;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-style: preserve-3d;
      cursor: pointer;
    }

    .card-inner.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 1.25rem;
      box-shadow: 0 6px 16px -4px rgba(139, 115, 85, 0.14), 0 2px 6px -1px rgba(139, 115, 85, 0.08);
      overflow: hidden;
    }

    /* 牌背設計：溫暖的點點與療癒葉片圖騰 */
    .card-back {
      background: linear-gradient(135deg, #F6E6D3 0%, #EED6BC 100%);
      border: 3px solid #FFFDF9;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-back-pattern {
      width: calc(100% - 14px);
      height: calc(100% - 14px);
      border-radius: 0.9rem;
      border: 2px dashed rgba(180, 142, 105, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: radial-gradient(rgba(180, 142, 105, 0.18) 2px, transparent 2px);
      background-size: 16px 16px;
    }

    /* 牌面設計 */
    .card-front {
      transform: rotateY(180deg);
      background-color: #FFFFFF;
      border: 3px solid #FFFFFF;
    }

    /* 配對成功微彈跳與發光動畫 */
    @keyframes matchCelebrate {
      0% { transform: rotateY(180deg) scale(1); }
      40% { transform: rotateY(180deg) scale(1.06); }
      75% { transform: rotateY(180deg) scale(0.98); }
      100% { transform: rotateY(180deg) scale(1); }
    }

    .card-inner.is-matched {
      animation: matchCelebrate 0.6s ease-out forwards;
    }

    .card-inner.is-matched .card-front {
      box-shadow: 0 0 0 3px #86EFAC, 0 10px 20px -5px rgba(34, 197, 94, 0.25);
    }

    /* 彈窗進場動畫 */
    @keyframes modalPop {
      0% { opacity: 0; transform: scale(0.88) translateY(16px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .animate-modal-pop {
      animation: modalPop 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* 隱藏捲軸但保留彈窗內容可滾動（防極端小螢幕） */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="flex flex-col justify-between p-3 sm:p-4 md:p-5 select-none">

  <!-- 頂部控制列 (Header) -->
  <header class="w-full max-w-6xl mx-auto bg-white/85 backdrop-blur-md rounded-2xl shadow-sm border border-[#EDE2D5] px-3 py-2.5 sm:px-5 sm:py-3 flex flex-wrap items-center justify-between gap-2 shrink-0 z-10">
    
    <!-- 左側：標題與計分板 -->
    <div class="flex items-center gap-3 sm:gap-4">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-amber-100 flex items-center justify-center text-amber-600 shadow-inner">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
            <line x1="9" y1="9" x2="9.01" y2="9"/>
            <line x1="15" y1="9" x2="15.01" y2="9"/>
          </svg>
        </div>
        <div>
          <h1 class="text-base sm:text-lg md:text-xl font-black tracking-wide text-[#5C4B3B] leading-tight">情緒小森林</h1>
          <p class="text-[11px] sm:text-xs text-[#8C7A6B] hidden sm:block">iPad 互動情緒配對卡</p>
        </div>
      </div>

      <!-- 狀態數據膠囊 -->
      <div class="flex items-center gap-2 bg-[#FAF4EC] px-3 py-1.5 rounded-xl border border-[#EFE4D6]">
        <div class="text-center px-1.5">
          <span class="text-[11px] text-[#8C7A6B] block leading-none">已配對</span>
          <span id="score-display" class="text-sm sm:text-base font-black text-emerald-600">0 / 6</span>
        </div>
        <div class="w-[1px] h-6 bg-[#E5D7C6]"></div>
        <div class="text-center px-1.5">
          <span class="text-[11px] text-[#8C7A6B] block leading-none">翻牌步數</span>
          <span id="moves-display" class="text-sm sm:text-base font-black text-amber-600">0</span>
        </div>
      </div>
    </div>

    <!-- 右側：難度、模式與輔助開關 -->
    <div class="flex flex-wrap items-center gap-1.5 sm:gap-2.5">
      
      <!-- 難度選擇 -->
      <div class="flex bg-[#F3EAE0] p-1 rounded-xl" role="group" aria-label="難度選擇">
        <button onclick="setDifficulty('easy')" id="btn-diff-easy" class="diff-btn px-2.5 py-1.5 sm:px-3 rounded-lg text-xs sm:text-sm font-bold transition-all bg-white text-[#5C4B3B] shadow-sm">
          初階 <span class="hidden md:inline text-xs font-normal text-[#8C7A6B]">(12張)</span>
        </button>
        <button onclick="setDifficulty('medium')" id="btn-diff-medium" class="diff-btn px-2.5 py-1.5 sm:px-3 rounded-lg text-xs sm:text-sm font-bold transition-all text-[#8C7A6B] hover:text-[#5C4B3B]">
          中階 <span class="hidden md:inline text-xs font-normal text-[#8C7A6B]">(16張)</span>
        </button>
        <button onclick="setDifficulty('hard')" id="btn-diff-hard" class="diff-btn px-2.5 py-1.5 sm:px-3 rounded-lg text-xs sm:text-sm font-bold transition-all text-[#8C7A6B] hover:text-[#5C4B3B]">
          進階 <span class="hidden md:inline text-xs font-normal text-[#8C7A6B]">(20張)</span>
        </button>
      </div>

      <!-- 玩法模式切換 -->
      <button onclick="toggleGameMode()" id="btn-mode" class="px-3 py-2 rounded-xl bg-sky-50 hover:bg-sky-100 active:scale-95 text-sky-800 border border-sky-200 text-xs sm:text-sm font-bold transition-all flex items-center gap-1.5 shadow-sm" title="切換配對玩法">
        <span id="mode-icon">🎴</span>
        <span id="mode-text">經典配對</span>
      </button>

      <!-- 社工/教育引導「情緒小分享」開關 -->
      <button onclick="toggleSharePrompt()" id="btn-share-toggle" class="px-3 py-2 rounded-xl bg-amber-100/80 hover:bg-amber-200/80 active:scale-95 text-amber-900 border border-amber-300 text-xs sm:text-sm font-bold transition-all flex items-center gap-1.5 shadow-sm" title="配對成功時顯示引導對話卡">
        <span id="share-indicator" class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span>
        <span>情緒小分享</span>
      </button>

      <!-- 音效開關 -->
      <button onclick="toggleMute()" id="btn-mute" class="p-2 sm:p-2.5 rounded-xl bg-[#F3EAE0] hover:bg-[#E8DCCE] active:scale-95 text-[#5C4B3B] transition-all" aria-label="音效開關" title="開啟/關閉音效">
        <svg id="icon-sound-on" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
        <svg id="icon-sound-off" class="w-5 h-5 hidden text-rose-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
      </button>

      <!-- 重新開始 -->
      <button onclick="initGame()" class="p-2 sm:p-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white shadow-sm transition-all flex items-center gap-1 font-bold text-xs sm:text-sm" aria-label="重新洗牌" title="重新洗牌">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
        <span class="hidden lg:inline pr-1">重玩</span>
      </button>
    </div>
  </header>

  <!-- 遊戲主舞台 (自適應 iPad 橫向與直向滿版網格) -->
  <main class="flex-1 w-full max-w-6xl mx-auto my-2.5 sm:my-3.5 flex items-center justify-center min-h-0">
    <div id="game-board" class="w-full h-full grid gap-2.5 sm:gap-3.5 md:gap-4 transition-all duration-300">
      <!-- 卡片將由 JS 動態生成並填滿網格 -->
    </div>
  </main>

  <!-- 底部提示列 -->
  <footer class="w-full max-w-6xl mx-auto text-center text-xs sm:text-sm text-[#8C7A6B] shrink-0 pb-0.5 flex items-center justify-center gap-2">
    <span id="mode-hint-banner" class="bg-white/70 px-3 py-1 rounded-full border border-[#EDE2D5]">
      💡 提示：點擊兩張卡片，找出相同的「情緒表情」吧！
    </span>
  </footer>

  <!-- 彈窗 1：社工/教育引導「情緒小分享」互動卡 -->
  <div id="share-modal" class="fixed inset-0 bg-stone-900/45 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-[#FFFDF9] border-4 border-white rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl animate-modal-pop text-center relative">
      
      <!-- 頂部標籤 -->
      <div class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full bg-amber-100 text-amber-800 text-xs sm:text-sm font-bold mb-4">
        <span>✨ 配對成功！情緒小分享</span>
      </div>

      <!-- 情緒大圖示與名稱 -->
      <div id="modal-emotion-badge" class="w-28 h-28 sm:w-32 sm:h-32 mx-auto rounded-3xl flex items-center justify-center p-3 mb-3 shadow-inner">
        <!-- SVG 動態插入 -->
      </div>
      <h2 id="modal-emotion-name" class="text-3xl sm:text-4xl font-black text-[#4A3F35] mb-2 tracking-wider">開心</h2>
      
      <!-- 情緒簡單定義 -->
      <p id="modal-emotion-def" class="text-base sm:text-lg text-[#6E5D4F] bg-[#F8F2EA] rounded-2xl p-3.5 mb-4 leading-relaxed font-medium">
        遇到喜歡的事情，心裡覺得甜甜的、充滿活力。
      </p>

      <!-- 引導提問區塊 -->
      <div class="bg-sky-50/90 border-2 border-sky-100 rounded-2xl p-4 sm:p-5 mb-6 text-left">
        <div class="flex items-center gap-2 text-sky-700 font-bold text-sm sm:text-base mb-1.5">
          <span>💬 一起聊聊看：</span>
        </div>
        <p id="modal-emotion-question" class="text-base sm:text-xl font-bold text-sky-950 leading-snug">
          你最近一次覺得「開心」是什麼時候呢？發生了什麼事？
        </p>
      </div>

      <!-- 繼續遊戲按鈕 -->
      <button onclick="closeShareModal()" class="w-full py-3.5 sm:py-4 rounded-2xl bg-emerald-500 hover:bg-emerald-600 active:scale-98 text-white text-lg sm:text-xl font-black shadow-lg shadow-emerald-500/25 transition-all">
        聊完了，繼續遊戲！
      </button>
    </div>
  </div>

  <!-- 彈窗 2：通關鼓勵畫面 -->
  <div id="victory-modal" class="fixed inset-0 bg-stone-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-[#FFFDF9] border-4 border-amber-200 rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl animate-modal-pop text-center">
      <div class="text-5xl sm:text-6xl mb-3">🎉🌟</div>
      <h2 class="text-2xl sm:text-3xl font-black text-[#4A3F35] mb-2">太棒了！全部配對完成！</h2>
      <p class="text-base sm:text-lg text-[#7A6857] mb-6">你認識了好多不同的情緒，真是太厲害了！</p>
      
      <div class="grid grid-cols-2 gap-3 bg-[#FAF3E8] p-4 rounded-2xl mb-6 border border-[#EFE2D0]">
        <div>
          <span class="text-xs sm:text-sm text-[#8C7A6B] block">完成配對</span>
          <span id="win-pairs" class="text-xl sm:text-2xl font-black text-emerald-600">6 組情緒</span>
        </div>
        <div>
          <span class="text-xs sm:text-sm text-[#8C7A6B] block">總共翻牌</span>
          <span id="win-moves" class="text-xl sm:text-2xl font-black text-amber-600">14 步</span>
        </div>
      </div>

      <button onclick="closeVictoryAndRestart()" class="w-full py-4 rounded-2xl bg-amber-500 hover:bg-amber-600 active:scale-98 text-white text-lg sm:text-xl font-black shadow-lg shadow-amber-500/30 transition-all">
        再玩一次 🔄
      </button>
    </div>
  </div>

    /**
     * =========================================================================
     * 2. Web Audio API 柔和療癒音效合成器 (無需外部音檔)
     * =========================================================================
     */
    class SoundManager {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playFlip() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(520, now + 0.08);

        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.1);
      }

      playMatch() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        // 溫暖的 C 大調琶音 (C5 - E5 - G5 - C6)
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const now = this.ctx.currentTime + idx * 0.08;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.16, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.36);
        });
      }

      playMismatch() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.linearRampToValueAtTime(210, now + 0.18);

        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.22);
      }

      playVictory() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const melody = [
          { freq: 523.25, time: 0, dur: 0.14 },
          { freq: 659.25, time: 0.14, dur: 0.14 },
          { freq: 783.99, time: 0.28, dur: 0.14 },
          { freq: 1046.50, time: 0.44, dur: 0.45 },
          { freq: 783.99, time: 0.65, dur: 0.15 },
          { freq: 1046.50, time: 0.82, dur: 0.6 }
        ];

        melody.forEach(note => {
          const now = this.ctx.currentTime + note.time;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(note.freq, now);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.18, now + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, now + note.dur);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + note.dur + 0.02);
        });
      }
    }

    const soundFX = new SoundManager();

    /**
     * =========================================================================
     * 3. 遊戲狀態管理與邏輯
     * =========================================================================
     */
    const DIFFICULTY_CONFIG = {
      easy: { pairs: 6, label: '初階' },    // 12 張 (橫向 4x3 / 直向 3x4)
      medium: { pairs: 8, label: '中階' },  // 16 張 (橫向 4x4 / 直向 4x4)
      hard: { pairs: 10, label: '進階' }    // 20 張 (橫向 5x4 / 直向 4x5)
    };

    let state = {
      difficulty: 'easy',       // 'easy' | 'medium' | 'hard'
      gameMode: 'classic',      // 'classic' (同圖同詞) | 'comprehension' (表情與情境詞彙配對)
      enableSharePrompt: true,  // 是否開啟「情緒小分享」互動彈窗
      cards: [],
      flippedIndices: [],
      matchedCount: 0,
      moves: 0,
      isLocked: false,
      pendingVictory: false
    };

    /**
     * 根據難度與 iPad 螢幕方向（直向/橫向）動態計算最佳網格行列數
     */
    function updateGridLayout() {
      const board = document.getElementById('game-board');
      const isLandscape = window.innerWidth >= window.innerHeight;
      let cols = 4;
      let rows = 3;

      if (state.difficulty === 'easy') {
        cols = isLandscape ? 4 : 3;
        rows = isLandscape ? 3 : 4;
      } else if (state.difficulty === 'medium') {
        cols = 4;
        rows = 4;
      } else if (state.difficulty === 'hard') {
        cols = isLandscape ? 5 : 4;
        rows = isLandscape ? 4 : 5;
      }

      board.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
      board.style.gridTemplateRows = `repeat(${rows}, minmax(0, 1fr))`;
    }

    window.addEventListener('resize', updateGridLayout);
    window.addEventListener('orientationchange', () => {
      setTimeout(updateGridLayout, 100);
    });

    /**
     * 洗牌演算法 (Fisher-Yates Shuffle)
     */
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    /**
     * 初始化新遊戲
     */
    function initGame() {
      const config = DIFFICULTY_CONFIG[state.difficulty];
      // 隨機抽選指定數量的情緒
      const selectedEmotions = shuffleArray(EMOTIONS_DATA).slice(0, config.pairs);

      let deck = [];
      selectedEmotions.forEach(emotion => {
        if (state.gameMode === 'classic') {
          // 經典模式：兩張相同的「表情插畫 + 情緒名稱」
          deck.push({ emotion, cardType: 'classic', matched: false });
          deck.push({ emotion, cardType: 'classic', matched: false });
        } else {
          // 進階理解模式：一張「純表情插畫卡」，一張「情緒名稱與簡單描述卡」
          deck.push({ emotion, cardType: 'face-only', matched: false });
          deck.push({ emotion, cardType: 'text-only', matched: false });
        }
      });

      state.cards = shuffleArray(deck);
      state.flippedIndices = [];
      state.matchedCount = 0;
      state.moves = 0;
      state.isLocked = false;
      state.pendingVictory = false;

      updateStatsUI();
      updateGridLayout();
      renderBoard();
    }

    /**

     */

      state.cards.forEach((card, index) => {

        let frontContentHTML = '';

        if (cardType === 'classic') {
          // 經典模式：上方插畫 + 下方清晰情緒名稱
          frontContentHTML = `
            <div class="w-full h-full flex flex-col items-center justify-between p-2 sm:p-3" style="background-color: ${emotion.bgHex};">

    /**
     * 點擊卡片處理
     */
    function handleCardClick(index) {
      if (state.isLocked) return;
      const card = state.cards[index];
      if (!card || card.matched) return;
      if (state.flippedIndices.includes(index)) return; // 避免重複點擊同一張牌

      // 翻開卡片
      soundFX.playFlip();
      state.flippedIndices.push(index);
      const cardInner = document.getElementById(`card-inner-${index}`);
      cardInner.classList.add('is-flipped');

      // 當翻開兩張卡片時進行比對
      if (state.flippedIndices.length === 2) {
        state.moves++;
        updateStatsUI();
        checkForMatch();
      }
    }

    /**
     * 檢查兩張翻開的卡片是否配對成功
     */
    function checkForMatch() {
      state.isLocked = true;
      const [idx1, idx2] = state.flippedIndices;
      const card1 = state.cards[idx1];
      const card2 = state.cards[idx2];

      const isMatch = card1.emotion.id === card2.emotion.id;

      if (isMatch) {
        // 配對成功！
        setTimeout(() => {
          soundFX.playMatch();
          card1.matched = true;
          card2.matched = true;
          state.matchedCount++;
          updateStatsUI();

          const el1 = document.getElementById(`card-inner-${idx1}`);
          const el2 = document.getElementById(`card-inner-${idx2}`);
          el1.classList.add('is-matched');
          el2.classList.add('is-matched');

          state.flippedIndices = [];
          state.isLocked = false;

          const totalPairs = DIFFICULTY_CONFIG[state.difficulty].pairs;
          const isAllMatched = state.matchedCount === totalPairs;

          // 檢查是否開啟「情緒小分享」引導彈窗
          if (state.enableSharePrompt) {
            state.pendingVictory = isAllMatched;
            setTimeout(() => {
              openShareModal(card1.emotion);
            }, 450);
          } else if (isAllMatched) {
            setTimeout(() => {
              showVictoryModal();
            }, 550);
          }
        }, 300);
      } else {
        // 配對失敗，停留 1.1 秒讓兒童看清楚圖案與文字後再翻回
        setTimeout(() => {
          soundFX.playMismatch();
          const el1 = document.getElementById(`card-inner-${idx1}`);
          const el2 = document.getElementById(`card-inner-${idx2}`);
          if (el1) el1.classList.remove('is-flipped');
          if (el2) el2.classList.remove('is-flipped');

          state.flippedIndices = [];
          state.isLocked = false;
        }, 1100);
      }
    }

    /**
     * =========================================================================
     * 4. UI 更新與互動控制功能
     * =========================================================================
     */
    function updateStatsUI() {
      const totalPairs = DIFFICULTY_CONFIG[state.difficulty].pairs;
      document.getElementById('score-display').textContent = `${state.matchedCount} / ${totalPairs}`;
      document.getElementById('moves-display').textContent = state.moves;
    }

    function setDifficulty(level) {
      if (state.difficulty === level) return;
      state.difficulty = level;

      // 更新按鈕樣式
      ['easy', 'medium', 'hard'].forEach(lvl => {
        const btn = document.getElementById(`btn-diff-${lvl}`);
        if (lvl === level) {
          btn.className = 'diff-btn px-2.5 py-1.5 sm:px-3 rounded-lg text-xs sm:text-sm font-bold transition-all bg-white text-[#5C4B3B] shadow-sm';
        } else {
          btn.className = 'diff-btn px-2.5 py-1.5 sm:px-3 rounded-lg text-xs sm:text-sm font-bold transition-all text-[#8C7A6B] hover:text-[#5C4B3B]';
        }
      });

      initGame();
    }

    function toggleGameMode() {
      state.gameMode = state.gameMode === 'classic' ? 'comprehension' : 'classic';
      const iconEl = document.getElementById('mode-icon');
      const textEl = document.getElementById('mode-text');
      const hintEl = document.getElementById('mode-hint-banner');

      if (state.gameMode === 'classic') {
        iconEl.textContent = '🎴';
        textEl.textContent = '經典配對';
        hintEl.textContent = '💡 提示：點擊兩張卡片，找出相同的「情緒表情」吧！';
      } else {
        iconEl.textContent = '🧠';
        textEl.textContent = '表情與情境';
        hintEl.textContent = '💡 進階挑戰：請將「表情插畫卡」與對應的「情緒詞彙卡」配對在一起！';
      }

      initGame();
    }

    function toggleSharePrompt() {
      state.enableSharePrompt = !state.enableSharePrompt;
      const btn = document.getElementById('btn-share-toggle');
      const indicator = document.getElementById('share-indicator');

      if (state.enableSharePrompt) {
        btn.classList.remove('bg-stone-100', 'text-stone-500', 'border-stone-200');
        btn.classList.add('bg-amber-100/80', 'text-amber-900', 'border-amber-300');
        indicator.classList.remove('bg-stone-400');
        indicator.classList.add('bg-emerald-500');
      } else {
        btn.classList.remove('bg-amber-100/80', 'text-amber-900', 'border-amber-300');
        btn.classList.add('bg-stone-100', 'text-stone-500', 'border-stone-200');
        indicator.classList.remove('bg-emerald-500');
        indicator.classList.add('bg-stone-400');
      }
    }

    function toggleMute() {
      soundFX.muted = !soundFX.muted;
      document.getElementById('icon-sound-on').classList.toggle('hidden', soundFX.muted);
      document.getElementById('icon-sound-off').classList.toggle('hidden', !soundFX.muted);
    }

    /**
     * 社工/教育引導「情緒小分享」彈窗控制
     */
    function openShareModal(emotion) {
      const modal = document.getElementById('share-modal');
      const badge = document.getElementById('modal-emotion-badge');
      const nameEl = document.getElementById('modal-emotion-name');
      const defEl = document.getElementById('modal-emotion-def');
      const qEl = document.getElementById('modal-emotion-question');

      badge.style.backgroundColor = emotion.bgHex;
      badge.innerHTML = emotion.svg;
      nameEl.textContent = emotion.name;
      nameEl.style.color = emotion.textHex;
      defEl.textContent = emotion.definition;
      qEl.textContent = emotion.question;

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeShareModal() {
      const modal = document.getElementById('share-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');

      if (state.pendingVictory) {
        state.pendingVictory = false;
        setTimeout(() => {
          showVictoryModal();
        }, 250);
      }
    }

    /**
     * 通關畫面控制
     */
    function showVictoryModal() {
      soundFX.playVictory();
      const totalPairs = DIFFICULTY_CONFIG[state.difficulty].pairs;
      document.getElementById('win-pairs').textContent = `${totalPairs} 組情緒`;
      document.getElementById('win-moves').textContent = `${state.moves} 步`;

      const modal = document.getElementById('victory-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeVictoryAndRestart() {
      const modal = document.getElementById('victory-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      initGame();
    }

    // 啟動遊戲
    window.addEventListener('DOMContentLoaded', () => {
      initGame();
    });
  </script>
</body>
</html>
